<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pyramid Face Left Gradient -->
    <linearGradient id="pyramidLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Pyramid Face Right Gradient -->
    <linearGradient id="pyramidRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Gold Accent Star -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14b8a6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle / Shield Outer Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Shield / Protection Outline in the background -->
  <path d="M64 20 C84 20 98 28 98 44 C98 74 76 96 64 104 C52 96 30 74 30 44 C30 28 44 20 64 20 Z" 
        fill="none" stroke="#134e4a" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Stylized Pyramid of Parque do Povo (A Pirâmide) -->
  <g filter="url(#dropGlow)">
    <!-- Base shadow/platform -->
    <ellipse cx="64" cy="88" rx="34" ry="7" fill="#042f2e" opacity="0.6" />

    <!-- Left facet of the Pyramid -->
    <polygon points="64,30 32,84 64,88" fill="url(#pyramidLeft)" />

    <!-- Right facet of the Pyramid -->
    <polygon points="64,30 64,88 96,84" fill="url(#pyramidRight)" />

    <!-- Central architectural ridge line -->
    <line x1="64" y1="30" x2="64" y2="88" stroke="#5eead4" stroke-width="1.5" opacity="0.9" />

    <!-- Architectural horizontal tier segments of the Pyramid structure -->
    <path d="M48 57 L64 59 L80 57" fill="none" stroke="#042f2e" stroke-width="1.5" opacity="0.6" />
    <path d="M39 72 L64 75 L89 72" fill="none" stroke="#042f2e" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Inspection Badge & Checkmark (Selo de Vistoria / Fiscalização) -->
  <g transform="translate(68, 64)">
    <!-- Circular Badge Backing -->
    <circle cx="20" cy="20" r="18" fill="#0f172a" stroke="#2dd4bf" stroke-width="2.5" />
    <!-- Glowing Inner Ring -->
    <circle cx="20" cy="20" r="15" fill="#042f2e" />
    <!-- Crisp Checkmark (Conforme / Vistoriado) -->
    <path d="M12 20.5 L17.5 26 L28 14.5" fill="none" stroke="url(#checkGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Campina Grande / Paraíba Gold Sun Star Emblem (Top Right) -->
  <g transform="translate(28, 24)">
    <circle cx="6" cy="6" r="4.5" fill="url(#goldGrad)" />
    <!-- Rays -->
    <line x1="6" y1="-1" x2="6" y2="1" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" />
    <line x1="6" y1="11" x2="6" y2="13" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" />
    <line x1="-1" y1="6" x2="1" y2="6" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" />
    <line x1="11" y1="6" x2="13" y2="6" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
