<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="favPyrLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="favPyrRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="favCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="3.5" />
  
  <!-- Stylized Pyramid of Parque do Povo -->
  <ellipse cx="64" cy="88" rx="34" ry="7" fill="#042f2e" opacity="0.6" />
  <polygon points="64,28 30,84 64,88" fill="url(#favPyrLeft)" />
  <polygon points="64,28 64,88 98,84" fill="url(#favPyrRight)" />
  <line x1="64" y1="28" x2="64" y2="88" stroke="#5eead4" stroke-width="2" opacity="0.9" />

  <!-- Inspection Badge & Checkmark -->
  <g transform="translate(68, 64)">
    <circle cx="20" cy="20" r="18" fill="#0f172a" stroke="#2dd4bf" stroke-width="2.5" />
    <circle cx="20" cy="20" r="15" fill="#042f2e" />
    <path d="M12 20.5 L17.5 26 L28 14.5" fill="none" stroke="url(#favCheck)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
